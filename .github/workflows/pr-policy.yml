name: PR policy

on:
  pull_request:
    branches: [alpha, beta, rc, main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release path and label
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # The pull request that introduces this pipeline precedes the stages.
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/alpha" --silent 2>/dev/null; then
            echo "::notice::no alpha branch yet, nothing to enforce"
            exit 0
          fi
          # Read now, not from the event: a re-run sees the current labels.
          LABELS=$(gh pr view "$NUMBER" --json labels --jq '.labels[].name')
          export LABELS
          .github/scripts/check-pr.sh
