version: 2
# Only this fork's own workflows: npm and Docker updates come with the upstream
# sync, and bumping them here as well would conflict on the lockfile.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "alpha"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "release:none"
    # CodeQL refuses a configuration file written by another version, so its
    # actions are bumped together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
